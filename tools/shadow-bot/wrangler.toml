name = "shadow-access-bot"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Who gets access requests: Telegram user ids, comma-separated.
OWNER_CHAT_ID = "7878830498"

# Optional: one request per device per 10 minutes.
# Create a KV namespace (Workers → KV → Create) and put its id here.
# [[kv_namespaces]]
# binding = "THROTTLE"
# id = "<KV namespace id>"

# Secrets (Workers → shadow-access-bot → Settings → Variables and Secrets,
# or `npx wrangler secret put <NAME>`):
#   BOT_TOKEN      — token from @BotFather (for access requests)
#   GITHUB_TOKEN   — fine-grained token, Contents: read+write on folzy1092/tgfork
#                    only (for the admin menu's "Сохранить" / "Объявить")
#   ADMIN_SECRET   — shared secret; the same string is entered once in the app's
#                    "Доступ устройств" → "Ключ администратора"
