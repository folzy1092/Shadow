name: CI

on:
  push:
    branches: [ master ]
    # Documentation-only pushes do not build an IPA. A docs commit still counts
    # towards the build number (git rev-list --count), see SHADOW_AGENT_MAP.md.
    paths-ignore:
      - '**/*.md'
      # Whitelist edits from the admin menu do not need a new IPA.
      - 'shadow-whitelist.json'

  workflow_dispatch:

permissions:
  # write: the successful master build is published as a GitHub Release,
  # which the in-app "Обновления" screen compares against.
  contents: write

concurrency:
  group: shadow-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    # A cold-cache build alone takes ~40 min; 45 cut runs off right before
    # the IPA upload and release steps.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Restore Bazel output
        id: bazel_cache
        uses: actions/cache/restore@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-
            bazel-${{ runner.os }}-

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Configure Bazel memory and Swift execution
        run: |
          python3 -m unittest discover -s Tests/ShadowCI -v
          python3 build-system/ci/configure_bazel.py --workspace /Users/Shared/telegram-ios

      - name: Verify Shadow settings and screenshot regressions
        run: |
          python3 -B -m unittest discover -s Tests/ShadowSettings -p 'test_*.py'
          python3 -B -m unittest discover -s Tests/ShadowVisualSettings -p 'test_*.py'
          python3 build-system/ci/test_shadow_foundation.py
          python3 build-system/ci/test_shadow_postbox.py

      - name: Build the App
        id: build
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -x
          # Keep Make.py's exit status through the tee below.
          set -o pipefail

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # inject API credentials from repo secrets into the config (kept out of git history)
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::TELEGRAM_API_ID / TELEGRAM_API_HASH secrets are not set in repo settings"
            exit 1
          fi
          python3 - "$SOURCE_DIR/build-system/shadow-configuration.json" <<'PY'
          import json, os, sys
          path = sys.argv[1]
          with open(path) as f:
              cfg = json.load(f)
          cfg["api_id"] = os.environ["TELEGRAM_API_ID"]
          cfg["api_hash"] = os.environ["TELEGRAM_API_HASH"]
          with open(path, "w") as f:
              json.dump(cfg, f, indent=4)
          print("Injected api_id/api_hash into", path)
          PY

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/shadow-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          # Bazel always exposes the built target via the stable bazel-bin symlink.
          # (The old bazel-out/applebin_ios-*-opt-ST-* glob no longer matches under
          # Bazel 8 / Xcode 26.)
          IPA_PATH="bazel-bin/Telegram/Telegram.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            IPA_PATH="$(find -L bazel-out -type f -name 'Telegram.ipa' -path '*Telegram/Telegram.ipa' | head -n 1)"
          fi
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "::error::Telegram.ipa not found after build"; exit 1
          fi
          echo "Found IPA at: $IPA_PATH"
          cp "$IPA_PATH" "$OUTPUT_PATH/Telegram.ipa"

          # collect dsym (best-effort; do not fail the build if missing)
          mkdir -p build/DSYMs
          if [ -d "bazel-bin/Telegram/Telegram.app.dSYM" ]; then
            cp -R bazel-bin/Telegram/Telegram.app.dSYM build/DSYMs/ || true
          fi
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null || true

      # actions/cache's default post-step saves only on success. Keep completed
      # actions after a compiler failure too, so retries can reuse that work.
      - name: Save Bazel output
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') && steps.bazel_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: ${{ steps.bazel_cache.outputs.cache-primary-key }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-IPA-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        id: release
        if: ${{ github.ref == 'refs/heads/master' && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Tag build-<number>: Shadow's update check parses the number and
          # compares it with the installed CFBundleVersion.
          TAG="build-${BUILD_NUMBER}"
          # Fixed asset name: .../releases/download/build-N/Shadow.ipa is the
          # direct link for this build, .../releases/latest/download/Shadow.ipa
          # always points at the newest one.
          ASSET="$RUNNER_TEMP/Shadow.ipa"
          cp /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa "$ASSET"
          NOTES="$(printf '%s' "$COMMIT_MSG" | head -n 30)"
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Shadow ${APP_VERSION} (${BUILD_NUMBER})" \
            --notes "$NOTES"

      # The same release in the public data repo (folzy1092/tgfork), so IPA links
      # keep working if this repo goes private. Needs the TGFORK_RELEASE_TOKEN
      # secret (fine-grained token, Contents: read and write on tgfork only);
      # without it the step is skipped.
      - name: Mirror release to tgfork
        if: ${{ github.ref == 'refs/heads/master' && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          TGFORK_RELEASE_TOKEN: ${{ secrets.TGFORK_RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.TGFORK_RELEASE_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TGFORK_RELEASE_TOKEN" ]; then
            echo "TGFORK_RELEASE_TOKEN is not set, skipping the tgfork mirror"
            exit 0
          fi
          TAG="build-${BUILD_NUMBER}"
          ASSET="$RUNNER_TEMP/Shadow.ipa"
          [ -f "$ASSET" ] || cp /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa "$ASSET"
          NOTES="$(printf '%s' "$COMMIT_MSG" | head -n 30)"
          gh release create "$TAG" "$ASSET" \
            --repo folzy1092/tgfork \
            --target main \
            --title "Shadow ${APP_VERSION} (${BUILD_NUMBER})" \
            --notes "$NOTES"

      - name: Upload debugging symbols
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-DSYMs-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Notify Telegram
        if: ${{ always() && github.ref == 'refs/heads/master' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          IPA_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/build-${{ env.BUILD_NUMBER }}/Shadow.ipa
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set — skipping notification"
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            ICON="✅"
            HEAD="Сборка готова"
            if [ "$RELEASE_OUTCOME" = "success" ]; then
              TAIL="Скачать IPA: ${IPA_URL}"
            else
              TAIL="IPA: артефакт Shadow-IPA-${BUILD_NUMBER} на странице прогона."
            fi
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            # A newer push superseded this run, or it hit timeout-minutes
            # (concurrency.cancel-in-progress); that run reports its own result.
            ICON="⏹"
            HEAD="Сборка отменена (новый push или таймаут)"
            TAIL="Запущена более новая сборка, результат придёт от неё."
          else
            ICON="❌"
            HEAD="Сборка упала"
            ERRORS="$(python3 "$GITHUB_WORKSPACE/build-system/ci/build_failure_summary.py" "$GITHUB_WORKSPACE/build.log" || true)"
            if [ -n "$ERRORS" ]; then
              TAIL="$(printf 'Ошибки:\n%s' "$ERRORS")"
            else
              TAIL="Ошибка не в компиляции (тесты или подготовка) — открой лог прогона."
            fi
          fi

          # first line of the commit message only
          COMMIT_FIRST_LINE="$(printf '%s' "$COMMIT_MSG" | head -n 1)"

          TEXT="$(printf '%s %s\nShadow %s (build %s)\nКоммит: %s\n%s\n%s' \
            "$ICON" "$HEAD" "$APP_VERSION" "$BUILD_NUMBER" "$COMMIT_FIRST_LINE" "$TAIL" "$RUN_URL")"

          curl -sS --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" \
            || echo "Telegram notification failed (non-fatal)"

      - name: Notify Discord
        if: ${{ always() && github.ref == 'refs/heads/master' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING_USER_ID: ${{ secrets.DISCORD_PING_USER_ID }}
          JOB_STATUS: ${{ job.status }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          IPA_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/build-${{ env.BUILD_NUMBER }}/Shadow.ipa
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook secret not set — skipping notification"
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            ICON="✅"
            HEAD="Сборка готова"
            if [ "$RELEASE_OUTCOME" = "success" ]; then
              TAIL="Скачать IPA: ${IPA_URL}"
            else
              TAIL="IPA: артефакт Shadow-IPA-${BUILD_NUMBER} на странице прогона."
            fi
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            # A newer push superseded this run, or it hit timeout-minutes
            # (concurrency.cancel-in-progress); that run reports its own result.
            ICON="⏹"
            HEAD="Сборка отменена (новый push или таймаут)"
            TAIL="Запущена более новая сборка, результат придёт от неё."
          else
            ICON="❌"
            HEAD="Сборка упала"
            ERRORS="$(python3 "$GITHUB_WORKSPACE/build-system/ci/build_failure_summary.py" "$GITHUB_WORKSPACE/build.log" || true)"
            if [ -n "$ERRORS" ]; then
              TAIL="$(printf 'Ошибки:\n%s' "$ERRORS")"
            else
              TAIL="Ошибка не в компиляции (тесты или подготовка) — открой лог прогона."
            fi
          fi

          COMMIT_FIRST_LINE="$(printf '%s' "$COMMIT_MSG" | head -n 1)"

          MENTION=""
          ALLOWED_USERS="[]"
          if [ -n "$DISCORD_PING_USER_ID" ]; then
            MENTION="<@${DISCORD_PING_USER_ID}> "
            ALLOWED_USERS="[\"${DISCORD_PING_USER_ID}\"]"
          fi

          CONTENT="$(printf '%s%s %s\nShadow %s (build %s)\nКоммит: %s\n%s\n%s' \
            "$MENTION" "$ICON" "$HEAD" "$APP_VERSION" "$BUILD_NUMBER" "$COMMIT_FIRST_LINE" "$TAIL" "$RUN_URL")"

          PAYLOAD="$(python3 - "$CONTENT" "$ALLOWED_USERS" <<'PY'
          import json, sys
          content = sys.argv[1]
          allowed_users = json.loads(sys.argv[2])
          print(json.dumps({
              "username": "Shadow CI",
              "content": content,
              "allowed_mentions": {"users": allowed_users},
          }))
          PY
          )"

          curl -sS --max-time 30 \
            -H "Content-Type: application/json" \
            -X POST "$DISCORD_WEBHOOK_URL" \
            -d "$PAYLOAD" \
            || echo "Discord notification failed (non-fatal)"
