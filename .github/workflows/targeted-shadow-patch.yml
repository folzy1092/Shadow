name: Targeted Shadow patch

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal Swift type-check fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('submodules/TelegramUI/Components/ChatTitleView/Sources/ChatTitleComponent.swift'): (
                  '''                self.shadowNamesDisposable.set((ayuGramSettings(postbox: component.context.account.postbox)\n                |> map { ($0.preferUsernameForNonContacts, $0.preferUsernameForBots) }\n                |> distinctUntilChanged(isEqual: { $0.0 == $1.0 && $0.1 == $1.1 })\n                |> deliverOnMainQueue).start(next: { [weak self] enabled in''',
                  '''                let shadowNamesSignal: Signal<(Bool, Bool), NoError> = ayuGramSettings(postbox: component.context.account.postbox)\n                |> map { settings -> (Bool, Bool) in\n                    return (settings.preferUsernameForNonContacts, settings.preferUsernameForBots)\n                }\n                |> distinctUntilChanged(isEqual: { lhs, rhs in\n                    return lhs.0 == rhs.0 && lhs.1 == rhs.1\n                })\n                |> deliverOnMainQueue\n                self.shadowNamesDisposable.set(shadowNamesSignal.start(next: { [weak self] enabled in'''
              ),
              Path('submodules/TelegramUI/Components/ChatTitleView/Sources/ChatTitleView.swift'): (
                  '''        self.shadowNamesDisposable.set((ayuGramSettings(postbox: context.account.postbox)\n        |> map { ($0.preferUsernameForNonContacts, $0.preferUsernameForBots) }\n        |> distinctUntilChanged(isEqual: { $0.0 == $1.0 && $0.1 == $1.1 })\n        |> deliverOnMainQueue).start(next: { [weak self] enabled in''',
                  '''        let shadowNamesSignal: Signal<(Bool, Bool), NoError> = ayuGramSettings(postbox: context.account.postbox)\n        |> map { settings -> (Bool, Bool) in\n            return (settings.preferUsernameForNonContacts, settings.preferUsernameForBots)\n        }\n        |> distinctUntilChanged(isEqual: { lhs, rhs in\n            return lhs.0 == rhs.0 && lhs.1 == rhs.1\n        })\n        |> deliverOnMainQueue\n        self.shadowNamesDisposable.set(shadowNamesSignal.start(next: { [weak self] enabled in'''
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one target block, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- submodules/TelegramUI/Components/ChatTitleView/Sources/ChatTitleComponent.swift submodules/TelegramUI/Components/ChatTitleView/Sources/ChatTitleView.swift

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Shadow CI Patch"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add submodules/TelegramUI/Components/ChatTitleView/Sources/ChatTitleComponent.swift submodules/TelegramUI/Components/ChatTitleView/Sources/ChatTitleView.swift
          git commit -m "Fix username settings signal type checking"
          git push origin HEAD:master
